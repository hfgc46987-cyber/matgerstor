# StoreCraft — Supabase local development configuration
# https://supabase.com/docs/guides/local-development

project_id = "storecraft"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/verify-email", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = false
enable_autoconfirm = false

# OTP / magic-link settings
[auth.otp]
expiry = 600

[auth.mailer]
secure_email_change_enabled = true

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.store-assets]
public = true
file_size_limit = "5MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "10MiB"
